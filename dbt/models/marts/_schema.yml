version: 2

models:
  - name: mart_team_efficiency
    description: One row per team per game, as per-100-possession rates.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [game_id, team_id]
    columns:
      - name: ortg
        description: >
          Points scored per 100 possessions. The range is wide on purpose:
          USA beat Cote d'Ivoire 117-24 at the U17s, which is a real ORTG of
          27. This is here to catch a broken possessions estimate, not to
          flag a blowout, and the possessions range below does the tighter job.
        tests:
          - not_null
          - dbt_utils.accepted_range: {min_value: 20, max_value: 250}
      - name: drtg
        tests:
          - not_null
          - dbt_utils.accepted_range: {min_value: 20, max_value: 250}
      - name: efg_pct
        tests:
          - dbt_utils.accepted_range: {min_value: 0, max_value: 100}
      - name: possessions
        description: >
          FIBA games run roughly 65-85 possessions. Outside that range means
          the estimator or its inputs are wrong.
        tests:
          - dbt_utils.accepted_range: {min_value: 50, max_value: 110}

  - name: mart_standings
    description: >
      Group tables. One row per team per GROUP, not per competition — some
      formats have two group phases and a team plays in both. Canada is in
      group B and then group F of the World Cup 2027 Americas Qualifiers.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [competition, group_code, team_id]
    columns:
      - name: games_played
        tests: [not_null]
      - name: win_pct
        tests:
          - dbt_utils.accepted_range: {min_value: 0, max_value: 100}

  - name: mart_player_leaders
    description: Per-player tournament aggregates — the leaderboard.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [competition, person_id]
    columns:
      - name: player_name
        tests: [not_null]
      - name: ppg
        tests:
          - not_null
          - dbt_utils.accepted_range: {min_value: 0, max_value: 60}
      - name: ts_pct
        tests:
          - dbt_utils.accepted_range: {min_value: 0, max_value: 150}
      - name: games_played
        tests:
          - dbt_utils.accepted_range: {min_value: 1, max_value: 15}
