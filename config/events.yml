# Which tournaments the pipeline follows.
#
# Two sources, unioned. Pinned slugs always run. Discovery adds anything new
# that Canada turns up in, which is what stops this file going stale the moment
# a new qualifier is announced.
#
# Pinning is not redundant with discovery: FIBA's event index only lists current
# and upcoming events, so a tournament drops off it once it finishes. All of the
# events below are already gone from the index but their pages still
# work, and without pinning we would silently stop rebuilding them.

team: CAN

# Which programme this project follows. 'womens', 'mens', or 'all'.
#
# Canada fields both, and discovery found both: the men's FIBA Basketball World
# Cup 2027 Americas Qualifiers came in on its own and brought 60 games and the
# senior men's roster with it. That's real data and the pipeline handled it
# fine, but the dashboard is the women's programme, so the scope belongs in
# config rather than in whatever happened to be on FIBA's index that day.
#
# FIBA publishes no gender field — see event_programme() in ingest/discover.py
# for why this is inferred from the slug.
programme: womens

pinned:
  # 2025: every women's 5x5 event Canada played. All are long gone from the
  # index and before the discovery window below, so they only come in pinned.
  - fiba-u16-womens-americup-2025
  - fiba-womens-americup-2025
  - fiba-u19-womens-basketball-world-cup-2025
  - fiba-womens-olympic-pre-qualifying-tournament-2026-guadalajara-mexico
  - fiba-u17-womens-basketball-world-cup-2026
  - fiba-u18-womens-americup-2026
  - fiba-womens-basketball-world-cup-2026-qualifying-tournament-istanbul-turkiye

  # The other three World Cup 2026 Qualifying Tournaments. Canada didn't play
  # in these, so discovery would never find them; they're here so the
  # comparison page can rank Canada against all 24 teams in the qualifiers,
  # not just the five in Istanbul. See `campaigns` below.
  - fiba-womens-basketball-world-cup-2026-qualifying-tournament-villeurbanne-france
  - fiba-womens-basketball-world-cup-2026-qualifying-tournament-san-juan-puerto-rico
  - fiba-womens-basketball-world-cup-2026-qualifying-tournament-wuhan-china

discover:
  enabled: true
  # Costs one fetch per candidate event, so keep the window tight.
  since: "2026-01-01"
  until: null
  # FIBA's own tag: gdap is 5x5, 3x3 is 3x3. Empty list means everything.
  disciplines: ["gdap"]

# Qualifying campaigns: tournaments run in parallel at different venues that
# feed the same final event. Each one gets a comparison page ranking every team
# across all of its venues, so staff can see where Canada stands beyond the
# teams it actually played.
#
# `match` is the start of FIBA's competition name, shared by every venue.
# A campaign with only one tournament (the 2026 Olympic Pre-Qualifier was a
# single event in Guadalajara) is skipped — there is nothing to compare.
campaigns:
  - slug: wc-qualifying-2026
    name: "FIBA Women's Basketball World Cup 2026 Qualifying Tournaments"
    short: "World Cup Qualifying 2026"
    match: "FIBA Women's Basketball World Cup 2026 Qualifying Tournament"
  - slug: olympic-pre-qualifying-2026-all
    name: "FIBA Women's Olympic Pre-Qualifying Tournaments 2026"
    short: "Olympic Pre-Qualifying 2026"
    match: "FIBA Women's Olympic Pre-Qualifying Tournament"
