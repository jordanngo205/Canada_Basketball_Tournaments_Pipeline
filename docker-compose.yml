# Postgres is both the Airflow metadata store and the analytics warehouse,
# kept in separate databases on one server. Two servers would be more faithful
# to production, but one is enough to demonstrate the separation and keeps the
# whole stack inside a laptop's memory budget.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fiba}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fiba}
      POSTGRES_DB: airflow
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once on an empty volume: creates the warehouse database and the
      # raw schema the ingest writes into.
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"   # 5433 on the host so it can't collide with a local Postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fiba} -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Airflow runs as three processes, the way a real deployment does, rather
  # than via `airflow standalone`. Standalone expects a terminal: run it
  # detached and forked tasks fail with "OSError: [Errno 5] Input/output
  # error" the moment they write output.
  #
  # The shared block below is YAML anchors — &airflow-common defines it once
  # and *airflow-common pulls it in, so the two services cannot drift apart.
  airflow-init:
    &airflow-common
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
        postgresql+psycopg2://${POSTGRES_USER:-fiba}:${POSTGRES_PASSWORD:-fiba}@postgres:5432/airflow
      # Where the DAG and dbt reach the warehouse. Inside Docker's network
      # containers find each other by service name, so this is `postgres:5432`
      # and not the localhost:5433 you use from your Mac.
      WAREHOUSE_DSN: >-
        postgresql://${POSTGRES_USER:-fiba}:${POSTGRES_PASSWORD:-fiba}@postgres:5432/warehouse
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-fiba}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fiba}
      EXPORT_DIR: /opt/airflow/out
      FIBA_EVENT_SLUG: ${FIBA_EVENT_SLUG:-fiba-womens-olympic-pre-qualifying-tournament-2026-guadalajara-mexico}
    volumes:
      &airflow-volumes
      - ./dags:/opt/airflow/dags
      - ./ingest:/opt/airflow/ingest
      - ./dbt:/opt/airflow/dbt
      - ./reports:/opt/airflow/reports
      - ./tests:/opt/airflow/tests
      - ./out:/opt/airflow/out
      - airflow_logs:/opt/airflow/logs
    # Migrate the metadata schema, then create the login. Both are safe to
    # re-run, so this can restart without special-casing first boot.
    command: >-
      bash -c "airflow db migrate &&
      airflow users create --username ${AIRFLOW_USER:-admin}
      --password ${AIRFLOW_PASSWORD:-admin}
      --firstname Jordan --lastname Ngo --role Admin
      --email ${AIRFLOW_EMAIL:-admin@example.com} || true"
    restart: "no"

  airflow-scheduler:
    <<: *airflow-common
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    volumes: *airflow-volumes
    command: scheduler
    restart: unless-stopped

  airflow-webserver:
    <<: *airflow-common
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    volumes: *airflow-volumes
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 6
    restart: unless-stopped

volumes:
  pgdata:
  airflow_logs:
